[project]
name = "citerag"
version = "0.1.0"
description = "Hybrid-search RAG with grounded citations and a retrieval evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
citerag = "citerag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["citerag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
