# What to index. Paths are relative to this file.
# The demo corpus is the author's portfolio projects, downloaded into ./corpus by `python scripts/fetch_projects.py`.
[corpus]
# This project's README is left out on purpose: it quotes the other projects' identifiers and example answers,
# so it would compete with the real sources (measured: Hit@5 dropped from 1.00 to 0.97). docs/ covers this project.
# A missing source is skipped with a warning.
sources = [
    "corpus/ConcreteCalc", "corpus/Portfolio", "docs",
    "corpus/health-monitor-dashboard", "corpus/devops", "corpus/AIVoiceAssistant", "corpus/DynamicLabyrinths",
]
include = [".md", ".txt", ".html", ".py", ".js", ".ts", ".css", ".json", ".toml", ".cs", ".sh", ".yml", ".yaml", "Dockerfile"]
exclude = ["node_modules", ".git", ".venv", "test-results", "package-lock.json", "icons", "index"]

[index]
path = "index"
embedder = "fastembed:BAAI/bge-small-en-v1.5"

[chunking]
max_chars = 1200
overlap_chars = 200

[retrieval]
# "hybrid" (BM25 + dense, RRF), "dense" or "bm25". On the 6-project corpus hybrid and dense tie on Hit@5; hybrid
# never misses identifier questions, so it is the default. See README "Evaluation".
mode = "hybrid"
top_k = 6
candidates = 30
mmr_lambda = 0.7
# Abstain gate: answer only if >= min_coverage of the question's IDF-weighted terms appear in the retrieved
# chunks, or the best cosine similarity reaches min_dense. Calibrated with `citerag eval`: off-topic questions
# peak at cos 0.547, the weakest answerable one is at 0.566, and min_dense sits at the midpoint. The margin is
# thin, so errors lean toward answering: the system prompt still makes Claude say when sources lack the answer.
# min_coverage is high on purpose: with six projects indexed, "What's the weather forecast for tomorrow?" covers
# 0.66 of its words by coincidence (a game with weather biomes, date-formatting code).
min_coverage = 0.8
min_dense = 0.555

[generation]
model = "claude-opus-5-5"
effort = "low"
max_tokens = 4096
# provider: "claude", "ollama" or "extractive". Unset = Claude when ANTHROPIC_API_KEY is set, else extractive.
# CITERAG_GENERATOR overrides it.
# provider = "ollama"
# Any instruction-tuned model from `ollama list`. qwen2.5:3b (~2 GB) runs on a 16 GB MacBook Air M1;
# llama3.2:3b is an alternative.
ollama_model = "qwen2.5:3b"
ollama_url = "http://localhost:11434"

[tracing]
# One JSON line per /ask and /search request in traces/{date}.jsonl (gitignored). Questions are stored truncated
# to 300 characters; /metrics serves only aggregates.
enabled = true  # the environment variable CITERAG_TRACING=0|1 overrides this
dir = "traces"
# /metrics is public, so the trace files are bounded: once today's file exceeds max_file_mb, no more traces are
# written that day (one warning in the log); files older than retention_days are deleted on the first write of a day.
max_file_mb = 50
retention_days = 14

# Estimated cost in USD per million tokens, Anthropic first-party API list prices (checked 2026-11-03). Used only
# for the cost estimate in traces. Local (Ollama) and extractive answers cost $0; a model missing here is
# recorded as cost null, not 0. Cache and fast-mode pricing are not modelled (citeRAG uses neither).
[pricing]
"claude-opus-5-5" = { input = 4.00, output = 20.00 }
# A model id with a date suffix ("claude-opus-5-5-20261101") is priced as the longest key that prefixes it.
# Refusal fallbacks may answer from an older model than the one configured; the `model` field of the trace
# (from the final message) records which one actually answered, so these entries keep that cost estimable.
"claude-opus-5" = { input = 5.00, output = 25.00 }
"claude-sonnet-5" = { input = 2.00, output = 10.00 }
"claude-opus-4-8" = { input = 5.00, output = 25.00 }
"claude-sonnet-5-5" = { input = 2.00, output = 10.00 }
"claude-haiku-5-5" = { input = 0.10, output = 0.50 }  # prompts up to 100K tokens
"claude-fable-5-2" = { input = 8.00, output = 40.00 }
